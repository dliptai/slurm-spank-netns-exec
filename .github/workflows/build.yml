name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libslurm-dev

      - name: Build
        run: make

      - name: Clean
        run: make clean

      - name: Tests
        run: |
          make test
          sudo ./testsuite

      - name: test ip netns
        run: |
          sudo apt-get install -y iproute2
          sudo ip netns add testns
          sudo ip netns exec testns ip addr
          sudo ip netns del testns
