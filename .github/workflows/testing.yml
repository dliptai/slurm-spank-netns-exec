name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libslurm-dev

      - name: Build
        run: make

      - name: Clean
        run: make clean

      - name: Build test
        run: make test

      - name: Run tests
        run: |
          set -u

          failed_tests=0

          function run_test {
              set +e
              local test_name="$1"
              local expected_rc="$2"
              local slurm_job_partition="$3"
              local spank_context="$4"
              local config_string="$5"

              echo "[TEST: $test_name, expect rc = $expected_rc]"
              # Run test and compare return code to expected
              if [ -n "$slurm_job_partition" ]; then
                  export SLURM_JOB_PARTITION="$slurm_job_partition"
              fi
              export SPANK_CONTEXT="$spank_context"

              output=$(sudo --preserve-env=SLURM_JOB_PARTITION,SPANK_CONTEXT ./test $config_string 2>&1)
              local actual_rc="$?"

              if [ "$actual_rc" -eq "$expected_rc" ]; then
                  echo "Pass"
              else
                  echo "Log:"
                  if [ -n "$output" ]; then
                      echo "++++"
                      echo "$output"
                      echo "++++"
                  else
                      echo "(no output)"
                  fi
                  echo "FAIL: $test_name (expected rc: $expected_rc, actual rc: $actual_rc)"
                  echo ""
                  failed_tests=$((failed_tests + 1))
              fi

              echo ""

              unset SLURM_JOB_PARTITION
              unset SPANK_CONTEXT
              set -e
          }

          # -----------------------------------------------------
          # Setup:

          # Set up a real network namespace
          sudo ip netns add test

          # Set up fake 'network namespace' files
          sudo touch /var/run/netns/test.fake
          sudo touch /var/run/netns/test.nonroot && sudo chown nobody /var/run/netns/test.nonroot
          sudo ln -s /var/run/netns/test /var/run/netns/test.link

          # -----------------------------------------------------

          run_test "end-to-end"                   0 "testpart"  1 "partition=testpart netns=test"
          run_test "Missing config"               1 "testpart"  1 "partition=testpart"
          run_test "Unknown config option"        2 "testpart"  1 "partition=testpart netns=test UNKNOWN_OPTION=value"
          run_test "Invalid config option"        3 "testpart"  1 "partition=testpart netns=/var/run/netns/test"
          run_test "Not remote context"           4 "testpart"  0 "partition=testpart netns=test"
          run_test "Missing SLURM_JOB_PARTITION"  5 ""          1 "partition=testpart netns=test"
          run_test "Wrong SLURM_JOB_PARTITION"    6 "wrongpart" 1 "partition=testpart netns=test"
          run_test "Unopenable netns"             7 "testpart"  1 "partition=testpart netns=test.link"
          run_test "Namespace not root"           8 "testpart"  1 "partition=testpart netns=test.nonroot"
          run_test "setns() fail"                 9 "testpart"  1 "partition=testpart netns=test.fake"

          # Cleanup
          sudo ip netns delete test

          echo "---------------------------------"
          echo "Total failed tests: $failed_tests"
          echo "---------------------------------"

          exit $failed_tests
